[versions]
checkstyle = "14.4.0"
formatter = "2.103.0"
junit = "6.1.3"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version = "3.27.7" }
jspecify = { module = "org.jspecify:jspecify", version = "1.0.1" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version = "2.52.0" }
nullaway = { module = "com.uber.nullaway:nullaway", version = "0.14.3" }

[plugins]
errorprone = { id = "net.ltgt.errorprone", version = "5.2.0" }
spotless = { id = "com.diffplug.spotless", version = "8.11.0" }
