[project]
name = "s95h-art-guardian"
version = "0.1.0"
description = "Experimental Samsung Art Store diagnostics and guarded recovery"
requires-python = ">=3.11"
dependencies = ["websocket-client==1.9.2"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.6"]

[project.scripts]
art-guardian = "art_guardian.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["art_guardian*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
